name: Test Automation CI

# Auto-changeable environment: the suite runs per environment (dev/qa/uat)
# and per report model, all driven by env vars consumed by config/settings.py.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [dev, qa, uat]
        default: qa
      report_type:
        description: "Report model"
        type: choice
        options: [allure, html, both]
        default: allure

jobs:
  # ── Fast gate: offline-safe smoke + core unit tests on every push ──
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, qa, uat]
    env:
      TEST_ENV: ${{ matrix.environment }}
      REPORT_TYPE: html
      HEADLESS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run framework core + prompt-layer (offline) tests
        run: pytest tests/regression/test_framework_core.py tests/regression/test_prompt_layer.py -v
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.environment }}
          path: reports/html/

  # ── Full suite (manual / scheduled): all markers, Allure report ────
  regression:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      TEST_ENV: ${{ github.event.inputs.environment }}
      REPORT_TYPE: ${{ github.event.inputs.report_type }}
      HEADLESS: "true"
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      JIRA_URL: ${{ secrets.JIRA_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      ADO_ORG_URL: ${{ secrets.ADO_ORG_URL }}
      ADO_PAT: ${{ secrets.ADO_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run regression suite
        run: pytest -m "regression or smoke" -n auto -v
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.event.inputs.environment }}
          path: reports/allure-results/
