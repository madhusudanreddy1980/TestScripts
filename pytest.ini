[pytest]
# ── Test discovery ────────────────────────────────────────────────
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ── Default options ───────────────────────────────────────────────
# --alluredir writes raw allure results; the report layer decides at
# runtime (via REPORT_TYPE) which report to actually surface.
# --reruns gives "auto-correct" behaviour for flaky tests.
addopts =
    -ra
    --strict-markers
    --tb=short
    --alluredir=reports/allure-results
    --reruns=2
    --reruns-delay=1

# ── Markers: drive the smoke / regression / suite selection ───────
markers =
    smoke: fast critical-path checks (run on every commit)
    regression: full regression suite
    e2e: end-to-end user journeys
    integration: cross-system / cross-integration tests
    gui: browser / UI tests
    api: REST API tests
    db: database tests
    flaky: known-flaky tests (extra reruns applied)

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
